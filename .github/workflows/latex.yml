name: Compilar PDF LaTeX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Compilar documento
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          extra_system_packages: biber

      - name: Publicar PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: documento-pdf
          path: main.pdf

